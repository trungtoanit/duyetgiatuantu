<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin: 2px 0; }
    .muted { color: #656d76; }
    .warn { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 6px; padding: 8px; margin: 8px 0; }
    .err { color: #cf222e; word-break: break-word; margin: 6px 0; }
    ul { padding-left: 18px; margin: 6px 0; }
    button { padding: 6px 10px; margin-top: 8px; cursor: pointer; }
    details { margin-top: 10px; }
    label { display: block; margin-top: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 4px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Duyệt giá Tuấn Tú</h1>

  <div id="warn" class="warn" hidden>
    Chưa bật quyền chạy User Scripts. Vào trang quản lý extension → <b>Chi tiết</b> → bật
    <b>Allow User Scripts</b> (Chrome 138+) hoặc bật <b>Developer mode</b> (Chrome cũ hơn).
    <br><button id="openExt">Mở trang cài đặt extension</button>
  </div>

  <div class="row"><span class="muted">Repo</span><code id="repo"></code></div>
  <div class="row"><span class="muted">Commit</span><code id="sha">–</code></div>
  <div class="row"><span class="muted">Phiên bản</span><span id="version">–</span></div>
  <div class="row"><span class="muted">Kiểm tra lần cuối</span><span id="lastCheck">–</span></div>
  <div id="error" class="err"></div>

  <b>Script đang chạy</b>
  <ul id="scripts"><li class="muted">Chưa có</li></ul>

  <button id="sync">Cập nhật ngay</button>
  <button id="reload">Tải lại tab hiện tại</button>

  <details>
    <summary>Cài đặt</summary>
    <form id="form">
      <label>Owner <input name="owner"></label>
      <label>Repo <input name="repo"></label>
      <label>Nhánh <input name="branch"></label>
      <label>Thư mục script <input name="dir"></label>
      <label>Token (chỉ khi repo private) <input name="token" type="password"></label>
      <label>Chu kỳ kiểm tra (phút) <input name="intervalMinutes" type="number" min="1"></label>
      <label>Anthropic API key (đánh giá NVKD) <input name="anthropicKey" type="password"></label>
      <label>Model Claude <input name="model"></label>
      <button type="submit">Lưu</button>
    </form>
  </details>

  <script type="module" src="popup.js"></script>
</body>
</html>
