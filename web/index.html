<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Danh sách công ty – Tuấn Tú</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#eff6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--pri)}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:#1e3a8a;color:#fff}
.top b{font-size:15px}
.top .sp{flex:1}
.top button{cursor:pointer;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
.top button.on{background:#fff;color:#1e3a8a}
.wrap{max-width:1600px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 10px rgba(15,23,42,.08);padding:12px 14px}
.muted{color:var(--mut);font-size:12px}
.login{max-width:360px;margin:12vh auto 0}
.login h1{font-size:18px;margin:0 0 4px;color:#1e3a8a}
.login label{display:block;margin-top:10px;font-weight:700;font-size:12.5px}
.login input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #cbd5e1;margin-top:3px}
.btn{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:700}
.btn.pri{background:#2563eb;border-color:#2563eb;color:#fff}
.btn.red{color:#b91c1c;border-color:#fecaca}
.btn:disabled{opacity:.5;cursor:default}
.f{font-size:12.5px;padding:4px 7px;border-radius:7px;border:1px solid #cbd5e1;background:#fff}
.err{color:#b91c1c;margin-top:8px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f8fafc;text-align:left;padding:6px;white-space:nowrap;position:sticky;top:0}
td{padding:5px 6px;border-top:1px solid #f1f5f9;vertical-align:top}
tbody tr:hover td{background:#e0f2fe!important}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 230px)}
.pop{position:absolute;left:0;top:calc(100% + 4px);z-index:40;width:min(380px,90vw);max-height:60vh;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.22);padding:6px}
.pop label{display:flex;gap:6px;align-items:center;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.pg{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
/* bảng 📋 của extension (scripts/maps/maps-tab.js): nằm dưới thanh trên cùng, ẩn nút mở nổi */
#dg-maps-tab{position:fixed;left:200px;right:0;bottom:0;top:46px;transform:translateZ(0);z-index:10}
.side{position:fixed;left:0;top:46px;bottom:0;width:200px;background:#fff;border-right:1px solid var(--line);padding:8px 0;z-index:11;overflow:auto}
.side a{display:flex;justify-content:space-between;gap:6px;padding:9px 12px;margin:2px 8px;border-radius:9px;text-decoration:none;color:#0f172a;font-weight:800;font-size:13px}
.side a span{color:#64748b;font-weight:700;font-size:12px}
.side a:hover{background:#f1f5f9}
.side a.on{background:#1e3a8a;color:#fff}.side a.on span{color:#bfdbfe}
.wrap.wl{margin-left:200px;max-width:none}
.stf-box{margin:10px 8px 0;padding-top:8px;border-top:1px solid #e2e8f0}
.stf-t{font-size:11px;font-weight:900;letter-spacing:.05em;color:#1d4ed8;text-transform:uppercase;padding:0 4px 6px}
.stf-sum{font-size:11.5px;line-height:1.6;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:6px 8px;margin-bottom:6px}
.stf-sum span{color:#94a3b8;font-size:10.5px}
.side a.stf{display:block;margin:0 0 6px;padding:7px 8px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font-weight:600}
.side a.stf:hover{border-color:#93c5fd;background:#f8fbff}
.side a.stf.on{border-color:#1e3a8a;background:#eff6ff;color:#0f172a;box-shadow:inset 3px 0 0 #1e3a8a}
.stf-h{display:flex;align-items:center;gap:6px;min-width:0}
.stf-av{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.stf-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-size:12.5px;color:#0f172a}
.stf-late{flex:none;font-size:10.5px;font-weight:900;color:#dc2626;background:#fef2f2;border-radius:6px;padding:0 4px}
.stf-g{display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:4px;margin-top:5px;text-align:center}
.stf-g>div{background:#f8fafc;border-radius:7px;padding:3px 2px;font-size:11px;line-height:1.25;white-space:nowrap}
.stf-g b{font-size:14px;color:#0f172a}
.stf-g small{display:block;color:#64748b;font-size:9.5px;font-weight:700}
.side a.stf span{font-size:inherit}.side a.stf .stf-nm{color:#0f172a;font-size:12.5px}.side a.stf .stf-late{color:#dc2626;font-size:10.5px}.side a.stf .stf-av{color:#fff;font-size:11px}
.ds-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ds-tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#f8fafc}
.ds-tile small{display:block;color:var(--mut);font-weight:800;font-size:11.5px}
.ds-tile b{font-size:20px}
.ds-g{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:900}
.ds-sc{height:5px;background:#e2e8f0;border-radius:3px;margin:3px 0 1px;overflow:hidden}.ds-sc i{display:block;height:100%;border-radius:3px}
.ds-res{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;background:#f1f5f9}.ds-res i{display:block;height:100%}
.ds-ch{display:flex;gap:6px;height:200px;margin-top:8px;padding-top:6px;overflow-x:auto}
.ds-col{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center}
.ds-bar{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid #cbd5e1}
.ds-bar i{display:block;width:70%;max-width:36px;background:#2563eb;border-radius:4px 4px 0 0;min-height:1px}
.ds-bar span{font-size:11px;font-weight:800;color:#334155}
.ds-col small{margin-top:3px;font-size:10.5px;line-height:1.2;color:#64748b;text-align:center;white-space:nowrap}
.ds-col:hover i{background:#1e40af}
#dg-call{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
#dg-call .cb-bg{position:fixed;inset:0;background:rgba(15,23,42,.45)}
#dg-call .cb{position:relative;width:min(860px,100%);padding:14px 16px}
@media (max-width:760px){.wrap.wl{margin-left:120px}}
@media (max-width:760px){.side{width:120px}.side a{font-size:12px;padding:8px}#dg-maps-tab{left:120px}}
#dg-maps-tab-btn{display:none!important}
@media (max-width:760px){
  .wrap{padding:8px}
  .hide-sm{display:none}
  .tbl{max-height:none}
}
</style>
</head>
<body>
<div id="app"><div class="wrap muted">⏳ Đang tải…</div></div>
<script src="config.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="../scripts/shared/company-pdf.js?v=2"></script>
<script src="app.js?v=16"></script>
</body>
</html>
